<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>og:image generator — PIPS OUT!</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  body{ background:#0d1b2c; color:#cfe9ff; font:13px/1.6 system-ui, sans-serif; margin:0; padding:20px; }
  h1{ font-size:15px; margin:0 0 4px; }
  p{ margin:0 0 16px; color:#8fb6dd; }
  #out{ width:100%; max-width:1200px; border:2px solid #2f7fd4; border-radius:8px; display:block; }
  #stage{ position:absolute; left:-9999px; top:0; width:460px; height:800px; border:0; }
  #log{ margin-top:12px; font-family:ui-monospace, monospace; color:#9bff6e; }
</style>
</head>
<body>

<h1>og:image generator</h1>
<p>
  Tekent het echte spel in een verborgen iframe, popt een handvol noppen, en zet het
  resultaat in een 1200×630 kaart voor Facebook. De JPEG gaat via POST naar
  <code>ogsave.py</code> op poort 8124 en belandt als <code>og.jpg</code> in de repo.
</p>

<canvas id="out" width="1200" height="630"></canvas>
<div id="log">bezig…</div>

<iframe id="stage"></iframe>

<script>
const W = 1200, H = 630;
const out = document.getElementById('out');
const c = out.getContext('2d');
const log = m => document.getElementById('log').textContent = m;
const wait = ms => new Promise(r => setTimeout(r, ms));

/* ---------- het spel echt laten spelen, zodat de kunst identiek is ---------- */
async function playBoard(){
  const fr = document.getElementById('stage');
  const doc = fr.contentDocument;
  const cv = doc.getElementById('game');

  doc.getElementById('btnStart').click();
  await wait(250);

  cv.setPointerCapture = () => {};
  const r = cv.getBoundingClientRect(), s = r.width / 440;
  const P = (t, x, y) => cv.dispatchEvent(new fr.contentWindow.PointerEvent(t, {
    clientX: r.left + x * s, clientY: r.top + y * s, bubbles: true, pointerId: 1, isPrimary: true
  }));

  // een deuk rechtsboven, net als op de affiche
  P('pointerdown', 300, 130);
  for (let a = 0; a < 400; a++){
    const x = 232 + Math.random() * 130, y = 78 + Math.random() * 122;
    if (Math.hypot(x - 300, y - 138) < 72) P('pointermove', x, y);
  }
  P('pointerup', 300, 130);

  await wait(1400);   // deeltjes laten uitdoven
  return cv;
}

/* ---------- achtergrond in de stijl van het spel ---------- */
function background(){
  const g = c.createRadialGradient(330, 300, 40, 330, 300, 900);
  g.addColorStop(0, '#1f6cc0'); g.addColorStop(.45, '#0f488a'); g.addColorStop(1, '#05203f');
  c.fillStyle = g; c.fillRect(0, 0, W, H);

  // stralen
  c.save(); c.translate(330, 290);
  for (let i = 0; i < 40; i++){
    if (i % 2) continue;
    c.beginPath(); c.moveTo(0, 0);
    const a0 = i * Math.PI / 20, a1 = (i + 1) * Math.PI / 20;
    c.arc(0, 0, 1400, a0, a1); c.closePath();
    c.fillStyle = 'rgba(255,255,255,.035)'; c.fill();
  }
  c.restore();

  const v = c.createRadialGradient(330, 300, 120, 330, 300, 820);
  v.addColorStop(0, 'rgba(3,20,45,0)'); v.addColorStop(1, 'rgba(3,20,45,.75)');
  c.fillStyle = v; c.fillRect(0, 0, W, H);
}

function px(size){ c.font = size + 'px "Press Start 2P", monospace'; }

function shadowText(t, x, y, col, sh, dx, dy){
  c.fillStyle = sh; c.fillText(t, x + (dx || 4), y + (dy || 4));
  c.fillStyle = col; c.fillText(t, x, y);
}

async function build(){
  await document.fonts.load('64px "Press Start 2P"');
  await document.fonts.load('18px "Press Start 2P"');
  const cv = await playBoard();

  background();

  // het blad, groot links
  const bh = 542, bw = bh * 440 / 520;
  c.save();
  c.shadowColor = 'rgba(0,0,0,.55)'; c.shadowBlur = 40; c.shadowOffsetY = 14;
  c.drawImage(cv, 76, 42, bw, bh);
  c.restore();

  const x0 = 620;
  c.textAlign = 'left';

  // nieuwsflits-label
  c.fillStyle = '#e8634a';
  c.beginPath(); c.roundRect(x0, 108, 306, 34, 5); c.fill();
  px(11); c.fillStyle = '#fff';
  c.fillText('WIELSBEKE NIEUWSFLITS', x0 + 13, 131);

  // logo
  px(64);
  shadowText('PIPS', x0, 232, '#e0413f', '#4d0b0e', 6, 6);
  shadowText('OUT!', x0, 308, '#ffd23f', '#6b4c00', 6, 6);

  c.fillStyle = '#e8634a';
  c.fillRect(x0, 340, 210, 8);

  // ondertitel
  c.font = 'bold 27px Georgia, "Times New Roman", serif';
  c.fillStyle = 'rgba(0,0,0,.6)'; c.fillText('Het officiële videospel van', x0 + 2, 400 + 2);
  c.fillStyle = '#ffffff';        c.fillText('Het officiële videospel van', x0, 400);
  c.fillStyle = 'rgba(0,0,0,.6)'; c.fillText('TTC Wielsbeke-Spotit', x0 + 2, 436 + 2);
  c.fillStyle = '#ffffff';        c.fillText('TTC Wielsbeke-Spotit', x0, 436);

  // pitch
  px(14); c.fillStyle = '#9dc7f0';
  c.fillText('Pop élke nop van je rubber.', x0, 492);
  c.fillText('Word de noppenspeler die het', x0, 518);
  c.fillText('bestuur altijd al wou.', x0, 544);

  // url
  px(12); c.fillStyle = '#5f9fd8';
  c.fillText('ttcwielsbeke.github.io/pipsout', x0, 592);

  // kader
  c.strokeStyle = 'rgba(158,212,255,.55)'; c.lineWidth = 6;
  c.strokeRect(3, 3, W - 6, H - 6);

  log('kaart getekend, versturen…');
  const send = (name, type, q) => new Promise(res => out.toBlob(async b => {
    const r = await fetch('http://127.0.0.1:8124/' + name, { method: 'POST', body: b });
    res(await r.text());
  }, type, q));
  try {
    log('KLAAR — ' + await send('og.jpg', 'image/jpeg', 0.92));
  } catch (e){
    log('POST mislukt (' + e.message + '). Draait ogsave.py op 8124?');
  }
}

/* klassiek rood op de kaart, wat de speler ook laatst koos */
const fr = document.getElementById('stage');
fr.addEventListener('load', () => build().catch(e => log('fout: ' + e.message)));
localStorage.setItem('ttcw_rubber', 'red');
fr.src = '../index.html';
</script>
</body>
</html>
